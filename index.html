<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fredjmoussastudio@gmail.com</title>

<style>
body {
  margin: 0;
  padding: 0;
  background-color: #ffffff;
  overflow: hidden;
  font-family: Helvetica, Arial, sans-serif;
}

#bouncing-email {
  position: fixed;
  white-space: nowrap;
  font-size: 18px;
  font-weight: bold;
  user-select: none;
  z-index: 1000;
  color: black;
}
</style>
</head>

<body>

<div id="bouncing-email">fredjmoussastudio@gmail.com</div>

<script>
const emailEl = document.getElementById("bouncing-email");

let x = Math.random() * (window.innerWidth - 300);
let y = Math.random() * (window.innerHeight - 50);
let speedX = 2;
let speedY = 2;

const colors = [
  "#FF0000", "#00FF00", "#0000FF", "#FF00FF", 
  "#00FFFF", "#FFA500", "#FF1493", "#32CD32"
];

function getRandomColor() {
  return colors[Math.floor(Math.random() * colors.length)];
}

function animateEmail() {
  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;
  const rect = emailEl.getBoundingClientRect();

  x += speedX;
  y += speedY;

  // Collision horizontale
  if (x + rect.width >= screenWidth || x <= 0) {
    speedX = -speedX;
    emailEl.style.color = getRandomColor();
  }

  // Collision verticale
  if (y + rect.height >= screenHeight || y <= 0) {
    speedY = -speedY;
    emailEl.style.color = getRandomColor();
  }

  emailEl.style.left = x + "px";
  emailEl.style.top = y + "px";

  requestAnimationFrame(animateEmail);
}

window.addEventListener("load", animateEmail);
</script>

</body>
</html>
