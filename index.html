<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FREDJ MOUSSA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      /* Arrière-plan responsive avec overlay sombre pour assurer la lisibilité */
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                  url("keswa(2025)[fredjmoussa].png") no-repeat center center fixed;
      background-size: cover;
      color: #f7f7f7;
      font-family: "Times New Roman", Times, Baskerville, Georgia, serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      max-width: 800px;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .status {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #e0e0e0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    .contact {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(0.8rem, 1.8vw, 1rem);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 1rem;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    .contact a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      padding-bottom: 2px;
      transition: border-color 0.3s ease, opacity 0.3s ease;
    }

    .contact a:hover {
      opacity: 0.75;
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>FREDJ MOUSSA</h1>
    <div class="status">WEBSITE COMING SOON</div>
    <div class="contact">
      FOR INQUIRIES : <a href="mailto:contact@fredjmoussa.studio">CONTACT@FREDJMOUSSA.STUDIO</a>
    </div>
  </div>

</body>
</html>
